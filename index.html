<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Material You 极简壁纸工坊 (Compose M3)</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Material Symbols Rounded 官方图标库 -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

  <!-- 主画布视口 (Surface) -->
  <main id="viewport">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="wallpaperCanvas"></canvas>
    </div>
  </main>

  <!-- 桌面端悬浮快捷按钮 (Compose ExtendedFloatingActionButton) -->
  <div class="floating-tools">
    <button class="m3-extended-fab" id="quickRandomBtn" title="快捷键: 空格键">
      <span class="material-symbols-rounded">casino</span>
      <span>随机造型</span>
    </button>
    <button class="m3-extended-fab" id="toggleMockupBtn" title="快捷键: M">
      <span class="material-symbols-rounded">devices</span>
      <span>桌面挂件</span>
    </button>
    <button class="m3-extended-fab" id="togglePanelBtn" title="快捷键: H">
      <span class="material-symbols-rounded">tune</span>
      <span>控制面板</span>
    </button>
  </div>

  <!-- 手机端规范 BottomAppBar (沉浸式底部导航栏) -->
  <nav id="mobileBottomBar">
    <button class="m3-bar-item" id="mobileRandomBtn">
      <span class="material-symbols-rounded bar-icon">casino</span>
      <span>随机</span>
    </button>
    <button class="m3-bar-item" id="mobilePaletteBtn">
      <span class="material-symbols-rounded bar-icon">palette</span>
      <span>灵感色</span>
    </button>
    <button class="m3-bar-item" id="mobileRatioBtn">
      <span class="material-symbols-rounded bar-icon">aspect_ratio</span>
      <span id="mobileRatioLabel">竖屏</span>
    </button>
    <button class="m3-bar-item" id="mobileDownloadBtn">
      <span class="material-symbols-rounded bar-icon">download</span>
      <span>下载</span>
    </button>
    <button class="m3-bar-item" id="mobileSettingsBtn">
      <span class="material-symbols-rounded bar-icon">tune</span>
      <span>调参</span>
    </button>
  </nav>

  <!-- 移动端底栏抽屉背景遮罩 (ModalBottomSheet Scrim) -->
  <div id="sheetScrim"></div>

  <!-- Compose ModalBottomSheet / NavigationDrawer -->
  <aside id="panel">
    <div class="m3-drag-handle" id="sheetDragHandle" title="向下滑动关闭"></div>

    <div class="panel-header">
      <div class="panel-title">
        <span>Material You</span>
        <span class="m3-pill-badge">Compose M3</span>
      </div>
      <div class="header-actions">
        <button class="m3-icon-btn" id="themeToggleBtn" title="切换深色/浅色主题">
          <span class="material-symbols-rounded" id="themeIcon">light_mode</span>
        </button>
        <button class="m3-icon-btn" id="undoBtn" title="撤销 (Ctrl+Z)">
          <span class="material-symbols-rounded">undo</span>
        </button>
        <button class="m3-icon-btn" id="redoBtn" title="重做 (Ctrl+Shift+Z)">
          <span class="material-symbols-rounded">redo</span>
        </button>
        <button class="m3-icon-btn" id="closePanelBtn" title="收起面板">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </div>

    <div class="panel-content">
      <!-- 艺术形态分段选择器 (Compose SegmentedButton) -->
      <section>
        <div class="section-title">艺术形态 (Style Mode)</div>
        <div class="m3-segmented-row">
          <button class="m3-segmented-btn active" data-mode="waves">
            <span class="material-symbols-rounded">waves</span>
            <span>极简波浪</span>
          </button>
          <button class="m3-segmented-btn" data-mode="pebbles">
            <span class="material-symbols-rounded">bubble_chart</span>
            <span>有机圆石</span>
          </button>
          <button class="m3-segmented-btn" data-mode="topography">
            <span class="material-symbols-rounded">terrain</span>
            <span>等高纸艺</span>
          </button>
        </div>
      </section>

      <!-- 预设调色板 (Compose FilterChips) -->
      <section>
        <div class="section-title">动态调色板 (Monet Dynamic Color)</div>
        <div class="palette-grid" id="paletteGrid"></div>

        <div class="color-action-row">
          <button class="m3-assist-chip" id="randomPaletteBtn">
            <span class="material-symbols-rounded">auto_awesome</span>
            <span>灵感配色</span>
          </button>
          <button class="m3-assist-chip" id="extractFromImgBtn">
            <span class="material-symbols-rounded">add_photo_alternate</span>
            <span>图片取色</span>
          </button>
          <input type="file" id="imgFileInput" accept="image/*" style="display: none;">
        </div>

        <div class="custom-colors">
          <div class="color-picker-item">
            <input type="color" id="color1Input" value="#b2ccc1">
            <span>色调 A</span>
          </div>
          <button class="m3-icon-btn" id="swapColorsBtn" title="交换色彩">
            <span class="material-symbols-rounded">swap_horiz</span>
          </button>
          <div class="color-picker-item">
            <input type="color" id="color2Input" value="#e7f2ed">
            <span>色调 B</span>
          </div>
        </div>
      </section>

      <!-- 几何与质感参数 (Compose Sliders & Switches) -->
      <section>
        <div class="section-title">几何与质感控制</div>
        <div class="m3-slider-group">
          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <span>层次条带数量</span>
              <span class="m3-slider-value" id="bandCountVal">4</span>
            </div>
            <input type="range" id="bandCountSlider" min="2" max="6" step="1" value="4">
          </div>

          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <span>流线倾斜角度</span>
              <span class="m3-slider-value" id="angleVal">-35°</span>
            </div>
            <input type="range" id="angleSlider" min="-85" max="85" step="1" value="-35">
          </div>

          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <span>波浪曲率弧度</span>
              <span class="m3-slider-value" id="curvVal">42%</span>
            </div>
            <input type="range" id="curvSlider" min="10" max="90" step="1" value="42">
          </div>

          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <span>起伏频次</span>
              <span class="m3-slider-value" id="freqVal">简约单峰 (1x)</span>
            </div>
            <input type="range" id="freqSlider" min="1" max="3" step="1" value="1">
          </div>

          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <span>胶片颗粒质感 (Film Grain)</span>
              <span class="m3-slider-value" id="grainVal">0%</span>
            </div>
            <input type="range" id="grainSlider" min="0" max="25" step="1" value="0">
          </div>

          <label class="m3-switch-row">
            <span>双色平滑渐变 (Gradient Flow)</span>
            <div class="m3-switch">
              <input type="checkbox" id="gradientToggle">
              <span class="m3-switch-track"></span>
            </div>
          </label>

          <label class="m3-switch-row">
            <span>纸艺柔和微阴影 (Paper Depth)</span>
            <div class="m3-switch">
              <input type="checkbox" id="shadowToggle">
              <span class="m3-switch-track"></span>
            </div>
          </label>
        </div>
      </section>

      <!-- 目标分辨率 (Compose Tonal Cards) -->
      <section>
        <div class="section-title">输出目标分辨率</div>
        <div class="res-grid" id="resGrid"></div>
      </section>
    </div>

    <!-- 底部操作区 (Compose Buttons) -->
    <div class="panel-footer">
      <button class="m3-btn m3-btn-outlined" id="randomBtn">
        <span class="material-symbols-rounded">casino</span>
        <span>随机新造型 (Space)</span>
      </button>
      <div class="m3-btn-row">
        <button class="m3-btn m3-btn-filled" id="downloadPngBtn">
          <span class="material-symbols-rounded">download</span>
          <span>下载高清 PNG</span>
        </button>
        <button class="m3-btn m3-btn-tonal" id="copyClipboardBtn" title="复制到剪贴板">
          <span class="material-symbols-rounded">content_copy</span>
          <span>复制</span>
        </button>
        <button class="m3-btn m3-btn-tonal" id="downloadSvgBtn" title="矢量 SVG 格式">
          <span class="material-symbols-rounded">polyline</span>
          <span>SVG</span>
        </button>
      </div>
    </div>
  </aside>

  <div id="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
