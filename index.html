<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Material You 壁纸工坊</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/fonts/fonts.css">
</head>
<body>

  <!-- 主画布视口 (Surface) -->
  <main id="viewport">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="wallpaperCanvas" role="img" aria-label="当前壁纸预览"></canvas>
    </div>
  </main>

  <!-- 桌面端全屏悬浮快捷栏 (仅在收起侧栏后呈现，与侧栏互补，避免按键重复) -->
  <div class="floating-tools" id="floatingTools">
    <button class="m3-extended-fab m3-fab-primary" id="togglePanelBtn" title="展开控制面板 (快捷键: H)">
      <span class="material-symbols-rounded" aria-hidden="true">tune</span>
      <span>展开面板</span>
    </button>
    <button class="m3-extended-fab" id="quickRandomBtn" title="快捷随机造型 (快捷键: 空格键)">
      <span class="material-symbols-rounded" aria-hidden="true">casino</span>
      <span>随机造型</span>
    </button>
    <button class="m3-extended-fab" id="toggleMockupBtn" title="桌面小组件预览 (快捷键: M)">
      <span class="material-symbols-rounded" aria-hidden="true">devices</span>
      <span>桌面挂件</span>
    </button>
    <button class="m3-extended-fab" id="quickDownloadBtn" title="快捷下载当前壁纸 (快捷键: Ctrl+S)">
      <span class="material-symbols-rounded" aria-hidden="true">download</span>
      <span>下载壁纸</span>
    </button>
  </div>

  <!-- 手机端规范 BottomAppBar (沉浸式底部导航栏) -->
  <nav id="mobileBottomBar">
    <button class="m3-bar-item" id="mobileRandomBtn">
      <span class="material-symbols-rounded bar-icon" aria-hidden="true">casino</span>
      <span>随机</span>
    </button>
    <button class="m3-bar-item" id="mobilePaletteBtn">
      <span class="material-symbols-rounded bar-icon" aria-hidden="true">palette</span>
      <span>灵感色</span>
    </button>
    <button class="m3-bar-item" id="mobileRatioBtn">
      <span class="material-symbols-rounded bar-icon" aria-hidden="true">aspect_ratio</span>
      <span id="mobileRatioLabel">竖屏</span>
    </button>
    <button class="m3-bar-item" id="mobileDownloadBtn">
      <span class="material-symbols-rounded bar-icon" aria-hidden="true">download</span>
      <span>下载</span>
    </button>
    <button class="m3-bar-item" id="mobileSettingsBtn">
      <span class="material-symbols-rounded bar-icon" aria-hidden="true">tune</span>
      <span>调参</span>
    </button>
  </nav>

  <!-- 移动端底栏抽屉背景遮罩 (ModalBottomSheet Scrim，仅移动端启用) -->
  <div id="sheetScrim"></div>

  <!-- Compose ModalBottomSheet / NavigationDrawer -->
  <aside id="panel" aria-label="壁纸设置">
    <div class="m3-drag-handle" id="sheetDragHandle" title="向下滑动关闭"></div>

    <div class="panel-header">
      <div class="panel-title">
        <span>Material You</span>
      </div>
      <div class="header-actions">
        <button class="m3-icon-btn" id="themeToggleBtn" title="切换深色/浅色主题" aria-label="切换深色/浅色主题">
          <span class="material-symbols-rounded" aria-hidden="true" id="themeIcon">light_mode</span>
        </button>
        <button class="m3-icon-btn" id="panelMockupBtn" title="桌面小组件预览 (快捷键: M)" aria-label="桌面小组件预览 (快捷键: M)">
          <span class="material-symbols-rounded" aria-hidden="true">devices</span>
        </button>
        <button class="m3-icon-btn" id="undoBtn" title="撤销 (Ctrl+Z)" aria-label="撤销 (Ctrl+Z)">
          <span class="material-symbols-rounded" aria-hidden="true">undo</span>
        </button>
        <button class="m3-icon-btn" id="redoBtn" title="重做 (Ctrl+Shift+Z)" aria-label="重做 (Ctrl+Shift+Z)">
          <span class="material-symbols-rounded" aria-hidden="true">redo</span>
        </button>
        <button class="m3-icon-btn" id="closePanelBtn" title="收起控制面板 (快捷键: H)" aria-label="收起控制面板 (快捷键: H)">
          <span class="material-symbols-rounded" aria-hidden="true">dock_to_right</span>
        </button>
      </div>
    </div>

    <div class="panel-content">
      <!-- 艺术形态分段选择器 (Compose SegmentedButton) -->
      <section>
        <div class="section-title">壁纸风格</div>
        <div class="m3-segmented-row">
          <button class="m3-segmented-btn active" data-mode="waves">
            <span class="material-symbols-rounded" aria-hidden="true">waves</span>
            <span>极简波浪</span>
          </button>
          <button class="m3-segmented-btn" data-mode="pebbles">
            <span class="material-symbols-rounded" aria-hidden="true">bubble_chart</span>
            <span>有机圆石</span>
          </button>
          <button class="m3-segmented-btn" data-mode="topography">
            <span class="material-symbols-rounded" aria-hidden="true">terrain</span>
            <span>等高纸艺</span>
          </button>
        </div>
      </section>

      <!-- 预设调色板 (Compose FilterChips) -->
      <section>
        <div class="section-title">调色板</div>
        <div class="palette-grid" id="paletteGrid"></div>

        <div class="color-action-row">
          <button class="m3-assist-chip" id="randomPaletteBtn">
            <span class="material-symbols-rounded" aria-hidden="true">auto_awesome</span>
            <span>灵感配色</span>
          </button>
          <button class="m3-assist-chip" id="extractFromImgBtn">
            <span class="material-symbols-rounded" aria-hidden="true">add_photo_alternate</span>
            <span>图片取色</span>
          </button>
          <button class="m3-assist-chip" id="shareBtn" title="复制可复现作品的分享链接">
            <span class="material-symbols-rounded" aria-hidden="true">link</span>
            <span>分享作品</span>
          </button>
          <input type="file" id="imgFileInput" accept="image/*" style="display: none;">
        </div>

        <div class="custom-colors">
          <div class="color-picker-item">
            <input aria-label="色调 A" type="color" id="color1Input" value="#b2ccc1">
            <span>色调 A</span>
          </div>
          <button class="m3-icon-btn" id="swapColorsBtn" title="交换色彩" aria-label="交换色彩">
            <span class="material-symbols-rounded" aria-hidden="true">swap_horiz</span>
          </button>
          <div class="color-picker-item">
            <input aria-label="色调 B" type="color" id="color2Input" value="#e7f2ed">
            <span>色调 B</span>
          </div>
        </div>
      </section>

      <!-- 几何与质感参数 (Compose Sliders & Switches) -->
      <section>
        <div class="section-title">形状与质感</div>
        <div class="m3-slider-group">
          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <label for="bandCountSlider" id="bandCountLabel">条带数量</label>
              <span class="m3-slider-value" id="bandCountVal">4</span>
            </div>
            <input type="range" id="bandCountSlider" min="2" max="6" step="1" value="4">
          </div>

          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <label for="angleSlider" id="angleLabel">流线倾斜角度</label>
              <span class="m3-slider-value" id="angleVal">-35°</span>
            </div>
            <input type="range" id="angleSlider" min="-85" max="85" step="1" value="-35">
          </div>

          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <label for="curvSlider">形状起伏</label>
              <span class="m3-slider-value" id="curvVal">42%</span>
            </div>
            <input type="range" id="curvSlider" min="10" max="90" step="1" value="42">
          </div>

          <div class="m3-slider-item" id="freqControl">
            <div class="m3-slider-label">
              <label for="freqSlider">起伏频次</label>
              <span class="m3-slider-value" id="freqVal">简约单峰 (1x)</span>
            </div>
            <input type="range" id="freqSlider" min="1" max="3" step="1" value="1">
          </div>

          <div class="m3-slider-item">
            <div class="m3-slider-label">
              <label for="grainSlider">胶片颗粒质感 (Film Grain)</label>
              <span class="m3-slider-value" id="grainVal">0%</span>
            </div>
            <input type="range" id="grainSlider" min="0" max="25" step="1" value="0">
          </div>

          <label class="m3-switch-row">
            <span>双色平滑渐变 (Gradient Flow)</span>
            <div class="m3-switch">
              <input type="checkbox" id="gradientToggle">
              <span class="m3-switch-track"></span>
            </div>
          </label>

          <label class="m3-switch-row">
            <span>纸艺柔和微阴影 (Paper Depth)</span>
            <div class="m3-switch">
              <input type="checkbox" id="shadowToggle">
              <span class="m3-switch-track"></span>
            </div>
          </label>
        </div>
      </section>

      <section>
        <div class="section-title">造型种子</div>
        <form id="seedForm" class="seed-control">
          <label for="seedInput">种子</label>
          <input id="seedInput" type="number" min="0" max="2147483646" step="1" required inputmode="numeric">
          <button class="m3-assist-chip" type="submit">应用种子</button>
        </form>
      </section>

      <!-- 目标分辨率 (Compose Tonal Cards) -->
      <section>
        <div class="section-title">导出尺寸</div>
        <div class="res-grid" id="resGrid"></div>
        <form id="customResolutionForm" class="custom-resolution">
          <div class="dimension-fields">
            <label>宽度<input id="outputWidthInput" type="number" min="1" max="16384" step="1" required inputmode="numeric"></label>
            <span aria-hidden="true">×</span>
            <label>高度<input id="outputHeightInput" type="number" min="1" max="16384" step="1" required inputmode="numeric"></label>
            <button class="m3-icon-btn" type="button" id="swapDimensionsBtn" aria-label="交换宽高" title="交换宽高">
              <span class="material-symbols-rounded" aria-hidden="true">swap_horiz</span>
            </button>
          </div>
          <div class="custom-resolution-actions">
            <span id="outputSizeHint" aria-live="polite"></span>
            <button type="submit" class="m3-assist-chip">应用尺寸</button>
          </div>
        </form>
      </section>
    </div>

    <!-- 底部操作区 (Compose Buttons) -->
    <div class="panel-footer">
      <button class="m3-btn m3-btn-outlined" id="randomBtn">
        <span class="material-symbols-rounded" aria-hidden="true">casino</span>
        <span>随机新造型 (Space)</span>
      </button>
      <div class="m3-btn-row">
        <button class="m3-btn m3-btn-filled" id="downloadPngBtn">
          <span class="material-symbols-rounded" aria-hidden="true">download</span>
          <span>下载高清 PNG</span>
        </button>
        <button class="m3-btn m3-btn-tonal" id="copyClipboardBtn" title="复制到剪贴板">
          <span class="material-symbols-rounded" aria-hidden="true">content_copy</span>
          <span>复制</span>
        </button>
        <button class="m3-btn m3-btn-tonal" id="downloadSvgBtn" title="矢量 SVG 格式">
          <span class="material-symbols-rounded" aria-hidden="true">polyline</span>
          <span>SVG</span>
        </button>
      </div>
    </div>
  </aside>

  <div id="exportStatus" role="status" aria-live="polite" hidden>
    <span id="exportStatusText"></span>
    <button class="m3-assist-chip" id="cancelExportBtn" type="button">取消</button>
  </div>
  <div id="imageDropHint" aria-hidden="true">拖入图片，提取壁纸配色</div>
  <dialog id="shareDialog" aria-labelledby="shareDialogTitle">
    <h2 id="shareDialogTitle">分享作品</h2>
    <p>复制下方链接，打开即可还原这张壁纸。</p>
    <label for="shareUrlInput">作品链接</label>
    <input id="shareUrlInput" type="text" readonly>
    <button class="m3-btn m3-btn-filled" id="closeShareDialogBtn">完成</button>
  </dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
